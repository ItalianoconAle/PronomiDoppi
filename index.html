<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - Pronomi Doppi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="quiz-container">
  <div class="instructions-box">
    <h3>Istruzioni</h3>
    <p>Using Pronomi Doppi, answer the following questions as though you are part of the conversation. Pay attention to verb tense!</p>
  </div>

  <div id="quiz">
    <div id="question" class="question">Caricamento...</div>
    <div id="options" class="options-container"></div>
    <button id="next-btn" class="btn" style="display: none;">Prossima domanda</button>
  </div>
  
  <div id="result-container" style="display: none;">
    <h2>Quiz Completato!</h2>
    <p id="score-text"></p>
    <button onclick="location.reload()" class="btn">Ricomincia il quiz</button>
  </div>
</div>

<script>
  const quizData = [
    {
      question: "Scrivete la lettera <u>ai vostri genitori</u>?",
      options: ["Sì, glielo scriviamo", "Sì, glieli scriviamo", "Sì, glieli scriviamo", "Sì, li scriviamo"],
      answer: 2
    },
    {
      question: "Compri il regalo <u>per Anna</u>?",
      options: ["No, non gliela compro.", "No, non glielo compro.", "No, non glielo compra.", "No, non gliele compro."],
      answer: 1
    },
      {
      question: "Dobbiamo dare il libro <u>a te e Lidia</u>?",
      options: ["Sì, ce lo dovete dare.", "Sì, ci lo dovete dare.", "Sì, ve lo dobbiamo dare.", "Sì, glielo dovete dare."],
      answer: 0
    },
          {
      question: "Raccontano la storia <u>a te</u>?",
      options: ["Sì, te la raccontano.", "Sì, me la racconto.", "Sì, te lo raccontano.", "Sì, me la raccontano."],
      answer: 3
    },
          {
      question: "Prepari la cena <u>per Carlo e Maria</u>?",
      options: ["Sì, gliela prepari.", "Sì, glieli preparo.", "Sì, gliela preparano.", "Sì, gliela preparo."],
      answer: 3
    },
          {
      question: "Date le chiavi <u>­a me e Alfredo</u>?",
      options: ["No, non ve le diamo.", "No, non ve le date.", "No, non ce li diamo.", "No, non ce le diamo."],
      answer: 0
    },
    
  
  ];

  let currentQuestion = 0;
  let score = 0;

  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");
  const nextBtn = document.getElementById("next-btn");
  const quizEl = document.getElementById("quiz");
  const resultContainer = document.getElementById("result-container");
  const scoreText = document.getElementById("score-text");

  function loadQuestion() {
    nextBtn.style.display = "none";
    const current = quizData[currentQuestion];
    questionEl.textContent = current.question;
    optionsEl.innerHTML = "";

    current.options.forEach((opt, index) => {
      const button = document.createElement("button");
      button.textContent = opt;
      button.classList.add("option-btn");
      button.addEventListener("click", () => selectOption(index, button));
      optionsEl.appendChild(button);
    });
  }

function selectOption(selectedIndex, selectedBtn) {
    const correctIndex = quizData[currentQuestion].answer;
    const buttons = optionsEl.querySelectorAll(".option-btn");

    // Disable all options once a choice is made
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) btn.classList.add("correct");
    });

    const isCorrect = selectedIndex === correctIndex;

    if (isCorrect) {
      score++;
      // Auto-advance after 800 milliseconds on correct answer
      setTimeout(() => {
        handleNextStep();
      }, 800);
    } else {
      selectedBtn.classList.add("incorrect");
      // Keep manual button for wrong answers so user can review
      if (currentQuestion < quizData.length - 1) {
        nextBtn.style.display = "block";
      } else {
        setTimeout(showResults, 1500);
      }
    }
  }

  function handleNextStep() {
    if (currentQuestion < quizData.length - 1) {
      currentQuestion++;
      loadQuestion();
    } else {
      showResults();
    }
  }

 nextBtn.addEventListener("click", handleNextStep);

  function showResults() {
    quizEl.style.display = "none";
    resultContainer.style.display = "block";
    scoreText.textContent = `Hai ottenuto ${score} su ${quizData.length} punti!`;
  }

  loadQuestion();
</script>
</body>
</html>
